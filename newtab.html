<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>How Many Tabs?</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>

  <body>
    <main class="container">
      <div id="count" class="count">0</div>
      <p id="message" class="message">You've opened tabs today</p>
    </main>

    <div class="theme-selector" id="theme-selector">
      <button data-theme="light" title="Light" aria-label="Light theme"></button>
      <button data-theme="dark" title="Dark" aria-label="Dark theme"></button>
      <button data-theme="system" title="System" aria-label="System theme"></button>
    </div>

    <script src="icons.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
