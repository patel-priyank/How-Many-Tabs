<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="theme-init.js"></script>
    <title>How Many Tabs?</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>

  <body>
    <main class="container">
      <div id="count" class="count">0</div>
      <p id="message" class="message">Counting today's tabs…</p>
    </main>

    <button class="stats-trigger" id="stats-trigger" title="View stats" aria-label="View stats"></button>

    <div class="theme-selector" id="theme-selector">
      <button data-theme="light" title="Light theme" aria-label="Light theme"></button>
      <button data-theme="dark" title="Dark theme" aria-label="Dark theme"></button>
      <button data-theme="system" title="System theme" aria-label="System theme"></button>
    </div>

    <dialog class="stats-modal" id="stats-modal">
      <div class="stats-actions">
        <button class="stats-reset" id="stats-reset">Reset</button>
        <button class="stats-export" id="stats-export">Export</button>
        <button class="stats-close" id="stats-close" title="Close stats" aria-label="Close stats"></button>
      </div>

      <div class="stats-container">
        <div class="stats-cards" id="stats-cards"></div>
        <div class="stats-chart-4-weeks" id="stats-chart-4-weeks"></div>
        <div class="stats-chart-weekdays" id="stats-chart-weekdays"></div>
      </div>
    </dialog>

    <script src="icons.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
